<div class="swatches" role="group" [attr.aria-label]="label()">
  @for (preset of presets(); track preset.color) {
    <button
      type="button"
      class="swatch"
      [class.selected]="marked() && value() === preset.color"
      [style.background]="preset.color"
      [attr.aria-label]="i18n.t(preset.name)"
      [attr.aria-pressed]="marked() && value() === preset.color"
      [title]="i18n.t(preset.name)"
      (click)="pick(preset.color)"
    ></button>
  }
  <input
    type="text"
    class="hex"
    maxlength="7"
    spellcheck="false"
    autocomplete="off"
    placeholder="#rrggbb"
    [class.invalid]="invalid()"
    [attr.aria-label]="i18n.t('settings.hexAria', { label: label() })"
    [attr.aria-invalid]="invalid()"
    [value]="text()"
    (input)="type($event)"
    (blur)="settle()"
  />
</div>
