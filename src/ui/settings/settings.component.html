<section class="section">
  <h2 class="heading">Páginas</h2>
  @for (page of pageRows(); track page.id) {
    <label class="check">
      <input
        type="checkbox"
        [checked]="page.enabled"
        (change)="togglePage(page.id, checkedOf($event))"
      />
      <span>{{ page.title }}</span>
    </label>
  }
</section>

<section class="section">
  <h2 class="heading">Aparência</h2>

  <div class="field">
    <span class="label">Cor de destaque</span>
    <dp-color-picker
      label="Cor de destaque"
      [presets]="accentPresets"
      [value]="settings().appearance.accentColor"
      (picked)="setAccent($event)"
    />
  </div>

  <div class="field">
    <span class="label">Fundo do popover</span>
    <dp-color-picker
      label="Fundo do popover"
      [presets]="backgroundPresets"
      [value]="backgroundValue()"
      [marked]="settings().appearance.popoverBackground !== null"
      (picked)="setBackground($event)"
    />
    <button
      type="button"
      class="link"
      [disabled]="settings().appearance.popoverBackground === null"
      (click)="setBackground(null)"
    >
      Usar padrão do tema
    </button>
  </div>

  <div class="field">
    <span class="label">Tema</span>
    <div class="segmented" role="radiogroup" aria-label="Tema">
      @for (theme of themes; track theme.mode) {
        <button
          type="button"
          role="radio"
          class="segment"
          [class.selected]="settings().appearance.theme === theme.mode"
          [attr.aria-checked]="settings().appearance.theme === theme.mode"
          (click)="setTheme(theme.mode)"
        >
          {{ theme.label }}
        </button>
      }
    </div>
  </div>
</section>
