[package]
name = "dev-pulse"
version = "0.1.0"
description = "App de bandeja com Claude usage, PRs, sessões, agenda e skills"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dev_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
