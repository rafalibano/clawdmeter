[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a build-time macro dependency of gtk-rs 0.18 (tauri on Linux); no safe upgrade until tauri moves off GTK3" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained since the merge into zbus 6; reached only on Linux through notify-rust (tauri-plugin-notification)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained since the merge into zbus 6; reached only on Linux through notify-rust (tauri-plugin-notification)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained since the merge into zbus 6; reached only on Linux through notify-rust (tauri-plugin-notification)" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
