name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows (msi, nsis)
            os: windows-latest
            rust-targets: ''
            args: --bundles msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: src-tauri

      - name: Check the tag matches the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "${TAG#v}" != "$package" ] || [ "${TAG#v}" != "$cargo" ]; then
            echo "::error::Tag $TAG does not match package.json ($package) and src-tauri/Cargo.toml ($cargo); the updater would publish latest.json with the old version."
            exit 1
          fi

      - run: yarn install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: yarn tauri
          tagName: ${{ github.ref_name }}
          releaseName: ClawdMeter ${{ github.ref_name }}
          releaseBody: Installation steps and the unsigned-app notice are in the README.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
