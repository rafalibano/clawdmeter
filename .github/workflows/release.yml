name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          existing=$(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .id')
          if [ -n "$existing" ]; then
            echo "A release for $TAG already exists: $existing"
          else
            gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "ClawdMeter $TAG" \
              --notes "Installation steps and the unsigned-app notice are in the README."
          fi

  release:
    name: ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows (msi, nsis)
            os: windows-latest
            rust-targets: ''
            args: --bundles msi,nsis
    runs-on: ${{ matrix.os }}
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: src-tauri

      - name: Check the tag matches the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "${TAG#v}" != "$package" ] || [ "${TAG#v}" != "$cargo" ]; then
            echo "::error::Tag $TAG does not match package.json ($package) and src-tauri/Cargo.toml ($cargo); the updater would publish latest.json with the old version."
            exit 1
          fi

      - run: yarn install --frozen-lockfile

      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ClawdMeter Self-Signed
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets in the release environment: ${missing[*]}. Run tools/macos-signing/create-certificate.sh and the gh secret set commands it prints (docs/DEVELOPMENT.md). Without them the app would be signed ad hoc and macOS would ask for the Keychain password after every update."
            exit 1
          fi
          keychain="$RUNNER_TEMP/clawdmeter-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/clawdmeter-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -x -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          read -r -a keychains <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          matches=$(security find-identity -p codesigning "$keychain" | awk '/Valid identities only/ { exit } { print }' | grep -cF "\"$APPLE_SIGNING_IDENTITY\"" || true)
          if [ "$matches" != "1" ]; then
            echo "::error::The certificate in APPLE_CERTIFICATE has $matches code signing identities named \"$APPLE_SIGNING_IDENTITY\"; expected exactly one. Create it with tools/macos-signing/create-certificate.sh."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: yarn tauri
          tagName: ${{ github.ref_name }}
          releaseName: ClawdMeter ${{ github.ref_name }}
          releaseBody: Installation steps and the unsigned-app notice are in the README.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/ClawdMeter.app
          codesign --verify --strict --verbose=2 "$app"
          details=$(codesign -dv --verbose=4 "$app" 2>&1)
          grep -E '^(Identifier|Authority|TeamIdentifier|CodeDirectory)' <<< "$details"
          codesign -d -r- "$app"
          if ! grep -qxF "Authority=$APPLE_SIGNING_IDENTITY" <<< "$details"; then
            echo "::error::$app is not signed by \"$APPLE_SIGNING_IDENTITY\"; installed apps would ask for the Keychain password again."
            exit 1
          fi

      - name: Delete the signing keychain
        if: always() && runner.os == 'macOS' && env.SIGNING_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$SIGNING_KEYCHAIN"

  publish:
    name: Publish the release
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check latest.json and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ids=$(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG and .draft) | .id')
          if [ "$(printf '%s\n' "$ids" | grep -c .)" != "1" ]; then
            echo "::error::Expected exactly one draft release for $TAG, found: ${ids:-none}."
            exit 1
          fi
          release_id=$ids
          gh api "repos/$REPO/releases/$release_id/assets" --paginate --jq '.[] | [.name, (.id | tostring)] | @tsv' > assets.tsv
          asset_id() { awk -F '\t' -v name="$1" '$1 == name { print $2 }' assets.tsv; }
          download() { gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$1"; }
          latest=$(asset_id latest.json)
          if [ -z "$latest" ]; then
            echo "::error::The draft release of $TAG has no latest.json."
            exit 1
          fi
          download "$latest" > latest.json
          version=$(jq -r .version latest.json)
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::latest.json has version $version, expected ${TAG#v}."
            exit 1
          fi
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            if ! jq -e --arg p "$platform" '.platforms[$p].url and .platforms[$p].signature' latest.json > /dev/null; then
              echo "::error::latest.json has no $platform entry; installed apps on it would not update."
              exit 1
            fi
          done
          while IFS=$'\t' read -r platform url signature; do
            sig=$(asset_id "${url##*/}.sig")
            if [ -z "$sig" ] || [ "$(download "$sig")" != "$signature" ]; then
              echo "::error::The $platform signature in latest.json does not match ${url##*/}.sig in the release."
              exit 1
            fi
          done < <(jq -r '.platforms | to_entries[] | [.key, .value.url, .value.signature] | @tsv' latest.json)
          gh api --method PATCH "repos/$REPO/releases/$release_id" -F draft=false -f make_latest=true > /dev/null
          echo "Published $TAG."
